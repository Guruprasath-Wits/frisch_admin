<div class="dark:bg-transparent min-vh-100 d-flex flex-row align-items-center custom-back">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group class="custom-form">
          <c-card class="p-4">
            <c-card-body>
              <form cForm [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <h1>Admin Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>
                <c-input-group class="mb-3">
                  <!-- <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span> -->
                  <input cFormControl placeholder="Username" formControlName="email"/>
                </c-input-group>

                <div *ngIf="usernameError" class="text-danger">
                  <small>Username is required.</small>
                </div>


                <c-input-group class="mb-4">
                  <!-- <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span> -->
                  <input cFormControl placeholder="Password" type="password" formControlName="password" />
                </c-input-group>

                <div *ngIf="passwordError" class="text-danger">
                  <small>Password is required.</small>
                </div>


                <c-row>
                  <c-col xs="6">
                    <button type="submit" cButton class="px-4 custom-btn" color="warning">
                      Login
                    </button>
                  </c-col>
                  <!-- <c-col class="text-right" xs="6">
                    <button cButton class="px-0" color="link">
                      Forgot password?
                    </button>
                  </c-col> -->
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white py-5 custom-girl">
            <c-card-body class="text-center">
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
