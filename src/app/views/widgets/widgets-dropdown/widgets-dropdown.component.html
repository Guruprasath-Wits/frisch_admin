<c-row class="g-4">
  <!-- Users Widget -->
  <c-col sm="6" xl="3">
    <div class="widget-card bg-gradient-primary">
      <div class="widget-content">
        <div class="widget-header">
          <div>
            <div class="widget-value">{{usersCount}}</div>
            <div class="widget-title">Total Users</div>
          </div>
          <div class="widget-icon-bg">
            <svg cIcon name="cilUser" size="xl"></svg>
          </div>
        </div>
        <div class="mt-2">
          <div class="trend-badge">
            <svg cIcon name="cilArrowTop" size="sm" class="me-1"></svg> Active
          </div>
        </div>
      </div>
      <div class="widget-chart-wrapper">
        <c-chart [data]="data[0]" [options]="options[0]" type="line" height="70"></c-chart>
      </div>
    </div>
  </c-col>

  <!-- Categories Widget -->
  <c-col sm="6" xl="3">
    <div class="widget-card bg-gradient-info">
      <div class="widget-content">
        <div class="widget-header">
          <div>
            <div class="widget-value">{{categoriesCount}}</div>
            <div class="widget-title">Categories</div>
          </div>
          <div class="widget-icon-bg">
            <svg cIcon name="cilList" size="xl"></svg>
          </div>
        </div>
        <div class="mt-2">
          <div class="trend-badge">
            <svg cIcon name="cilArrowTop" size="sm" class="me-1"></svg> Listed
          </div>
        </div>
      </div>
      <div class="widget-chart-wrapper">
        <c-chart [data]="data[1]" [options]="options[1]" type="line" height="70"></c-chart>
      </div>
    </div>
  </c-col>

  <!-- Products Widget -->
  <c-col sm="6" xl="3">
    <div class="widget-card bg-gradient-warning">
      <div class="widget-content">
        <div class="widget-header">
          <div>
            <div class="widget-value">{{productsCount}}</div>
            <div class="widget-title">Products</div>
          </div>
          <div class="widget-icon-bg">
            <svg cIcon name="cilBasket" size="xl"></svg>
          </div>
        </div>
        <div class="mt-2">
          <div class="trend-badge">
            <svg cIcon name="cilArrowTop" size="sm" class="me-1"></svg> In Stock
          </div>
        </div>
      </div>
      <div class="widget-chart-wrapper">
        <c-chart [data]="data[2]" [options]="options[2]" type="line" height="70"></c-chart>
      </div>
    </div>
  </c-col>

  <!-- Pending Orders Widget -->
  <c-col sm="6" xl="3">
    <div class="widget-card bg-gradient-danger">
      <div class="widget-content">
        <div class="widget-header">
          <div>
            <div class="widget-value">{{pendingOrdersCount}}</div>
            <div class="widget-title">Pending Orders</div>
          </div>
          <div class="widget-icon-bg">
            <svg cIcon name="cilCart" size="xl"></svg>
          </div>
        </div>
        <div class="mt-2">
          <div class="trend-badge">
            <svg cIcon name="cilClock" size="sm" class="me-1"></svg> Processing
          </div>
        </div>
      </div>
      <div class="widget-chart-wrapper">
        <c-chart [data]="data[3]" [options]="options[3]" type="bar" height="70"></c-chart>
      </div>
    </div>
  </c-col>
</c-row>
