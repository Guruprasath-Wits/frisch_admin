<div class="container-fluid adduser-container fade-in">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="card form-card">
        <!-- Premium Header -->
        <div class="card-header-custom">
          <h2 class="card-title">Add New User</h2>
          <p class="card-subtitle">Personal- und Kontodaten für neue Mitarbeiter festlegen</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <!-- Section 1: Personal Information -->
            <div class="form-section mb-5">
              <div class="section-header">
                <i class="fas fa-user-circle"></i>
                <h5>Persönliche Daten</h5>
              </div>
              <div class="row g-4">
                <div class="col-md-6">
                  <div class="form-group-custom">
                    <label class="form-label-custom">First Name</label>
                    <div class="input-group-custom">
                      <i class="fas fa-user input-icon"></i>
                      <input type="text" formControlName="fname" class="form-control-custom"
                        placeholder="Enter first name" />
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Last Name</label>
                    <div class="input-group-custom">
                      <i class="fas fa-user input-icon"></i>
                      <input type="text" formControlName="lname" class="form-control-custom"
                        placeholder="Enter last name" />
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Email Address</label>
                    <div class="input-group-custom">
                      <i class="fas fa-envelope input-icon"></i>
                      <input type="email" formControlName="email" class="form-control-custom"
                        placeholder="name@example.com" />
                    </div>
                    <div *ngIf="f['email'].touched && f['email'].errors?.['required']" class="text-danger">
                      Email address is required.
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Phone Number</label>
                    <div class="input-group-custom">
                      <i class="fas fa-phone-alt input-icon"></i>
                      <input type="number" formControlName="phone" class="form-control-custom"
                        placeholder="e.g. 0171 1234567" />
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Geburtsdatum</label>
                    <div class="input-group-custom position-relative">
                      <i class="fas fa-calendar-alt datepicker-icon-custom"></i>
                      <mat-form-field appearance="fill">
                        <input matInput [matDatepicker]="picker" formControlName="bday" placeholder="DD/MM/YYYY">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                      </mat-form-field>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Company Name</label>
                    <div class="input-group-custom">
                      <i class="fas fa-building input-icon"></i>
                      <input type="text" formControlName="company_name" class="form-control-custom"
                        placeholder="Company internal name" />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Section 2: Account & Permissions -->
            <div class="form-section mb-5">
              <div class="section-header">
                <i class="fas fa-shield-alt"></i>
                <h5>Konto & Berechtigungen</h5>
              </div>
              <div class="row g-4">
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Username</label>
                    <div class="input-group-custom">
                      <i class="fas fa-id-badge input-icon"></i>
                      <input type="text" formControlName="username" class="form-control-custom"
                        placeholder="Login username" />
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Password</label>
                    <div class="input-group-custom">
                      <i class="fas fa-key input-icon"></i>
                      <input type="password" formControlName="password" class="form-control-custom"
                        placeholder="••••••••" />
                    </div>
                    <div *ngIf="f['password'].invalid && f['password'].touched" class="text-danger">
                      Password is required.
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">System Role</label>
                    <div class="dropdown-premium-wrapper">
                      <div class="dropdown-trigger-custom" (click)="toggleRoleDropdown()"
                        [class.active]="roleDropdownOpen">
                        <i class="fas fa-user-tag input-icon"></i>
                        <span class="selected-text">{{ getSelectedRole() }}</span>
                        <i class="fas fa-chevron-down arrow-icon" [class.rotate]="roleDropdownOpen"></i>
                      </div>

                      <div class="dropdown-menu-premium" *ngIf="roleDropdownOpen">
                        <div class="dropdown-item-premium" *ngFor="let role of roles" (click)="selectRole(role)"
                          [class.selected]="loginForm.get('role')?.value == role.role_name">
                          <i class="fas fa-check-circle check-icon"></i>
                          <span>{{ role.role_name }}</span>
                        </div>
                      </div>
                    </div>
                    <div *ngIf="f['role'].touched && f['role'].errors?.['required']" class="text-danger">
                      Role selection is required.
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Section 3: Address & Bank Information -->
            <div class="form-section mb-5">
              <div class="section-header">
                <i class="fas fa-map-marked-alt"></i>
                <h5>Adresse & Bankdaten</h5>
              </div>
              <div class="row g-4">
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Street</label>
                    <div class="input-group-custom">
                      <i class="fas fa-road input-icon"></i>
                      <input type="text" formControlName="address" class="form-control-custom"
                        placeholder="Street name" />
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">House Number</label>
                    <div class="input-group-custom">
                      <i class="fas fa-home input-icon"></i>
                      <input type="text" formControlName="street" class="form-control-custom" placeholder="Number" />
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Zipcode</label>
                    <div class="input-group-custom">
                      <i class="fas fa-mail-bulk input-icon"></i>
                      <input type="text" formControlName="zipcode" class="form-control-custom"
                        placeholder="e.g. 10115" />
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">City / Area</label>
                    <div class="input-group-custom">
                      <i class="fas fa-city input-icon"></i>
                      <input type="text" formControlName="Subtown" class="form-control-custom" placeholder="Berlin" />
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Floor / Etage</label>
                    <div class="input-group-custom">
                      <i class="fas fa-layer-group input-icon"></i>
                      <input type="text" formControlName="floor" class="form-control-custom"
                        placeholder="e.g. 2nd Floor" />
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-group-custom">
                    <label class="form-label-custom">Aufzug (Lift)</label>
                    <div class="dropdown-premium-wrapper">
                      <div class="dropdown-trigger-custom" (click)="toggleLiftDropdown()"
                        [class.active]="liftDropdownOpen">
                        <i class="fas fa-elevator input-icon"></i>
                        <span class="selected-text">{{ getSelectedLift() }}</span>
                        <i class="fas fa-chevron-down arrow-icon" [class.rotate]="liftDropdownOpen"></i>
                      </div>

                      <div class="dropdown-menu-premium" *ngIf="liftDropdownOpen">
                        <div class="dropdown-item-premium" (click)="selectLift('Yes')"
                          [class.selected]="loginForm.get('lift_availability')?.value == 'Yes'">
                          <i class="fas fa-check-circle check-icon"></i>
                          <span>Ja</span>
                        </div>
                        <div class="dropdown-item-premium" (click)="selectLift('No')"
                          [class.selected]="loginForm.get('lift_availability')?.value == 'No'">
                          <i class="fas fa-check-circle check-icon"></i>
                          <span>Nein</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-group-custom">
                    <label class="form-label-custom">IBAN Account Number</label>
                    <div class="input-group-custom">
                      <i class="fas fa-university input-icon"></i>
                      <input type="text" formControlName="IBAN" class="form-control-custom"
                        placeholder="DE00 0000 0000 0000 0000 00" />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions d-flex justify-content-center gap-3 mt-5">
              <button type="button" class="btn-cancel-premium" (click)="resetForm()">
                <i class="fas fa-arrow-left me-2"></i> Cancel
              </button>
              <button type="submit" class="btn-submit-premium" [disabled]="loginForm.invalid">
                <i class="fas fa-user-plus me-2"></i> Add User Now
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
