<div class="container">
  <h3 class="mb-2" style="text-align: center; font-weight: bold !important;">{{ isEditMode ? 'Edit Permissions' : 'Add Permissions' }}</h3>

  <div class="add-user-card mb-3">
    <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="role-form">
      <div class="form-group mb-3">
        <label for="role" class="form-label">Role</label>
        <select style="width: 450px;" class="form-select form-control" formControlName="role" id="role">
          <option value="" disabled>Select a role</option>
          <option *ngFor="let role of roles" [value]="role.id">
            {{ role.role_name }}
          </option>
        </select>
        <div *ngIf="f['role'].touched && f['role'].errors?.['required']" class="text-danger">
          Role is required
        </div>
      </div>

      <div class="form-group mb-3">
        <h5 class="mb-3">Allocate Access</h5>
        <div class="access-grid">
          <div class="form-check" *ngFor="let page of pages">
            <input
              type="checkbox"
              class="form-check-input"
              style="border: 1px solid #e1b12c"
              [id]="page"
              (change)="onAccessChange(page, $event)"
              [checked]="allocatedAccess[page] === 1"
            />
            <label class="form-check-label" [for]="page">{{ page }}</label>
          </div>
        </div>
      </div>
      

      <button type="submit" class="btn btn-primary">
        {{ isEditMode ? 'Update Permissions' : 'Add Permissions' }}
      </button>
    </form>
  </div>

  <h3 style="text-align: center; font-weight: bold !important;"> Permissions List</h3>

  <div class="add-user-card">
    <table class="table table-hover role-table">
      <thead>
        <tr>
          <!-- <th>ID</th> -->
          <th>S.No</th>
         
          <th>Role Name</th>
          <th>Permissions</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let permission of paginatedPermissions let i = index">
          <td>{{ (page - 1) * itemsPerPage + i + 1 }}</td>
          <!-- <td>{{ permission.id }}</td> -->
          <td>{{ permission.role_name }}</td>
          <td>
            <ul>
              <ng-container *ngFor="let page of pages">
                <li class="text-success" style="font-weight: bold;letter-spacing: 1px;" *ngIf="permission.access[page] === 1">{{ page }}</li>
              </ng-container>
            </ul>
          </td>
          
          <td>
            <button class="btn btn-warning btn-sm" (click)="onEdit(permission)">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button
              class="btn btn-danger btn-sm"
              style="margin-left: 5px;"
              (click)="onDelete(permission.id)"
            >
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
        
        
      </tbody>
    </table>
  </div>

  <div class="pagination-controls">
    <button class="btn btn-secondary" (click)="previousPage()" [disabled]="page === 1">Previous</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button class="btn btn-secondary" (click)="nextPage()" [disabled]="page === totalPages">Next</button>
  </div>
</div>
