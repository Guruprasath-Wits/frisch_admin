<div class="container mt-4">
    <h3>Edit Combo Pack</h3>
    <div class="add-user-card">
        <form [formGroup]="comboForm" (ngSubmit)="onSubmit()">

            <!-- Name -->
            <div class="form-row">
                <div class="form-group">
                    <label for="product_name">Combo Name</label>
                    <input type="text" id="product_name" formControlName="product_name"
                        placeholder="Enter combo name" />
                    <div *ngIf="comboForm.get('product_name')?.invalid && comboForm.get('product_name')?.touched"
                        class="error">
                        <small>Name is required.</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" formControlName="nickname" placeholder="Enter nickname" />
                </div>
            </div>

            <!-- Select Products -->
            <div class="form-row">
                <div class="form-group">
                    <label>Select Products</label>
                    <div class="dropdown-box">
                        <div class="form-control" (click)="toggleComboDropdown()" style="cursor: pointer;">
                            {{ getSelectedComboProductNames() }}
                        </div>

                        <div *ngIf="comboDropdownOpen" class="dropdown-list">
                            <div *ngFor="let product of products" class="checkbox-item">
                                <input type="checkbox" class="form-check-input"
                                    [checked]="isComboProductSelected(product.id)"
                                    (change)="onComboProductChange(product.id, $event)" id="prod_{{ product.id }}" />
                                <label for="prod_{{ product.id }}" class="form-check-label">
                                    {{ product.product_name }} - €{{ product.price }}
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="mt-2 text-muted" *ngIf="totalValue > 0">
                        <strong>Total Value of Products: €{{ totalValue | number:'1.2-2' }}</strong>
                    </div>
                </div>
            </div>

            <!-- Price & Discount & VAT & Pfand -->
            <div class="form-row">
                <div class="form-group">
                    <label for="discount">Discount Percentage (%)</label>
                    <input type="number" id="discount" formControlName="discount" placeholder="Enter discount %" min="0"
                        max="100" />
                </div>

                <div class="form-group">
                    <label for="price">Final Price</label>
                    <input type="number" id="price" formControlName="price" placeholder="Enter price" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="vat">VAT (%)</label>
                    <select id="tax" formControlName="vat" class="form-control">
                        <option *ngFor="let tax of taxes" [value]="tax.tax_value">
                            {{ tax.tax_name }} ({{ tax.tax_value }}%)
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pfand">Pfand (Bottle Deposit) (€)</label>
                    <select id="pfand" formControlName="pfand" class="form-control">
                        <option *ngFor="let bottle of bottles" [value]="bottle.deposit">
                            {{ bottle.bottle_name }} ({{ bottle.deposit }}€)
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Availability</label>
                    <div class="days-container" style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <div *ngFor="let day of daysList" class="checkbox-item"
                            style="display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" class="form-check-input" [id]="'day_' + day" [value]="day"
                                [checked]="isDaySelected(day)" (change)="onDayChange(day, $event)">
                            <label class="form-check-label" [for]="'day_' + day">
                                {{ day }}
                            </label>
                        </div>
                    </div>
                </div>
            </div>



            <!-- Description, Nutritional Info, Ingredients -->
            <div class="form-row">
                <div class="form-group">
                    <label for="desc">Description</label>
                    <textarea id="desc" formControlName="desc" placeholder="Enter description"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="nutritional_info">Nutritional Information</label>
                    <textarea id="nutritional_info" formControlName="nutritional_info"
                        placeholder="Enter nutritional info"></textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ingredients">Ingredients</label>
                    <textarea id="ingredients" formControlName="ingredients" placeholder="Enter ingredients"></textarea>
                </div>
            </div>

            <!-- Image Upload -->
            <div class="form-row">
                <div class="form-group">
                    <label for="image">Upload Image</label>
                    <input type="file" id="image" (change)="onFileChange($event)" />
                    <div *ngIf="comboForm.get('product_img')?.value" class="image-preview">
                        <img [src]="getImageUrl(comboForm.get('product_img')?.value)" class="preview-img" />
                        <button type="button" class="btn btn-danger btn-sm" (click)="removeImage()">Remove</button>
                    </div>
                </div>
            </div>



            <button type="submit" class="btn btn-warning" style="width: 200px;">Update Combo Pack</button>
        </form>
    </div>
</div>
