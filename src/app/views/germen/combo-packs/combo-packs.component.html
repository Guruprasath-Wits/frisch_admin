<div class="container-fluid combo-container fade-in">
    <div class="card list-card">
        <div class="card-header-custom">
            <div class="d-flex justify-content-between align-items-center">
                <div class="text-center flex-grow-1">
                    <h4 class="card-title mb-2">Combo Packs</h4>
                    <p class="card-subtitle">Gesamt Combos: {{ products.length }}</p>
                </div>
                <button type="button" class="btn-add-combo" [routerLink]="['add']">
                    <i class="fas fa-plus me-2"></i>
                    Add Combo Pack
                </button>
            </div>
        </div>

        <div class="card-body">
            <!-- Search Bar -->
            <div class="search-wrapper mb-4">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Search by combo name or products..."
                    [(ngModel)]="searchTerm">
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table custom-table mb-0">
                    <thead>
                        <tr>
                            <th class="text-center" width="8%">#</th>
                            <th width="25%">Name</th>
                            <th width="30%">Products</th>
                            <th width="12%">Price</th>
                            <th width="12%">Status</th>
                            <th class="text-end" width="13%">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let product of filteredCombos; let i = index">
                            <td class="text-center">{{ i + 1 }}</td>
                            <td>
                                <h6 class="fw-bold mb-0">{{ product.name }}</h6>
                            </td>
                            <td>
                                <span class="product-list">{{ getProductNames(product.product_ids) }}</span>
                            </td>
                            <td>
                                <span class="badge-price">{{ product.price | currency:'EUR' }}</span>
                            </td>
                            <td>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" [checked]="product.status === 1"
                                        (change)="toggleStatus(product)">
                                    <label class="form-check-label status-label">
                                        {{ product.status === 1 ? 'Active' : 'Inactive' }}
                                    </label>
                                </div>
                            </td>
                            <td class="text-end">
                                <button class="btn-action btn-edit" [routerLink]="['edit', product.id]"
                                    title="Bearbeiten">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                                <button class="btn-action btn-delete" (click)="deleteProduct(product.id)"
                                    title="Löschen">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                        <tr *ngIf="filteredCombos.length === 0">
                            <td colspan="6" class="text-center py-5">
                                <div class="empty-state">
                                    <i class="fas fa-box-open mb-3"></i>
                                    <p class="text-muted">No combo packs found.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
