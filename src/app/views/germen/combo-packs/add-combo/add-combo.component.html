<div class="container-fluid combo-add-container fade-in">
    <div class="card form-card">
        <div class="card-header-custom text-center">
            <h4 class="card-title">Add Combo Pack</h4>
            <!-- <p class="card-subtitle">Create attractive product bundles</p> -->
        </div>

        <div class="card-body">
            <form [formGroup]="comboForm" (ngSubmit)="onSubmit()">

                <!-- Row 1: Name & Nickname -->
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label-custom">Combo Name</label>
                        <div class="input-group-custom">
                            <i class="fas fa-box input-icon"></i>
                            <input type="text" formControlName="product_name" class="form-control-custom"
                                placeholder="Enter combo name" />
                        </div>
                        <div *ngIf="comboForm.get('product_name')?.invalid && comboForm.get('product_name')?.touched"
                            class="text-danger small mt-1">
                            Name is required.
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-custom">Nickname</label>
                        <div class="input-group-custom">
                            <i class="fas fa-tag input-icon"></i>
                            <input type="text" formControlName="nickname" class="form-control-custom"
                                placeholder="Enter nickname" />
                        </div>
                    </div>
                </div>

                <!-- Row 2: Select Products -->
                <div class="mb-4">
                    <label class="form-label-custom">
                        <i class="fas fa-shopping-basket me-2"></i>
                        Select Products
                    </label>
                    <div class="dropdown-box">
                        <div class="form-control-custom dropdown-trigger" [class.active]="comboDropdownOpen"
                            (click)="toggleComboDropdown()">
                            <span class="selected-text">
                                {{ getSelectedComboProductNames() || 'Click to select products' }}
                            </span>
                            <i class="fas fa-chevron-down"></i>
                        </div>

                        <div *ngIf="comboDropdownOpen" class="dropdown-list">
                            <div class="dropdown-header">
                                <i class="fas fa-list-ul me-2"></i>
                                Available Products
                            </div>
                            <div *ngFor="let product of products" class="checkbox-item">
                                <input type="checkbox" class="form-check-input"
                                    [checked]="isComboProductSelected(product.id)"
                                    (change)="onComboProductChange(product.id, $event)" id="prod_{{ product.id }}" />
                                <label for="prod_{{ product.id }}" class="form-check-label">
                                    <span class="product-name">{{ product.product_name }}</span>
                                    <span class="product-price">€{{ product.price }}</span>
                                </label>
                            </div>
                            <div *ngIf="products.length === 0" class="empty-dropdown">
                                <i class="fas fa-inbox"></i>
                                <p>No products available</p>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 total-value-badge" *ngIf="totalValue > 0">
                        <i class="fas fa-calculator me-2"></i>
                        <strong>Total Value: €{{ totalValue | number:'1.2-2' }}</strong>
                    </div>
                </div>

                <!-- Row 3: Discount & Final Price -->
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label-custom">Discount Percentage (%)</label>
                        <div class="input-group-custom">
                            <i class="fas fa-percent input-icon"></i>
                            <input type="number" formControlName="discount" class="form-control-custom" placeholder="0"
                                min="0" max="100" />
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-custom">Final Price</label>
                        <div class="input-group-custom">
                            <i class="fas fa-euro-sign input-icon"></i>
                            <input type="number" formControlName="price" class="form-control-custom"
                                placeholder="Enter price" />
                        </div>
                    </div>
                </div>

                <!-- Row 4: VAT & Pfand -->
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label-custom">VAT (%)</label>
                        <div class="input-group-custom">
                            <i class="fas fa-receipt input-icon"></i>
                            <select formControlName="vat" class="form-control-custom">
                                <option value="">Select VAT</option>
                                <option *ngFor="let tax of taxes" [value]="tax.tax_value">
                                    {{ tax.tax_name }} ({{ tax.tax_value }}%)
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-custom">Pfand (Bottle Deposit) (€)</label>
                        <div class="input-group-custom">
                            <i class="fas fa-wine-bottle input-icon"></i>
                            <select formControlName="pfand" class="form-control-custom">
                                <option value="">Select Bottle</option>
                                <option *ngFor="let bottle of bottles" [value]="bottle.deposit">
                                    {{ bottle.bottle_name }} ({{ bottle.deposit }}€)
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Row 5: Availability -->
                <div class="mb-4">
                    <label class="form-label-custom">Availability</label>
                    <div class="days-container">
                        <div *ngFor="let day of daysList" class="day-checkbox">
                            <input type="checkbox" class="form-check-input" [id]="'day_' + day" [value]="day"
                                [checked]="isDaySelected(day)" (change)="onDayChange(day, $event)">
                            <label class="form-check-label" [for]="'day_' + day">
                                {{ day }}
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Row 6: Description -->
                <div class="mb-4">
                    <label class="form-label-custom">
                        <i class="fas fa-align-left me-2"></i>
                        Description
                    </label>
                    <textarea formControlName="desc" class="form-control-custom textarea-custom" rows="5"
                        placeholder="Enter a detailed description of the combo pack..."></textarea>
                </div>

                <!-- Row 7: Nutritional Information -->
                <div class="mb-4">
                    <label class="form-label-custom">
                        <i class="fas fa-heartbeat me-2"></i>
                        Nutritional Information
                    </label>
                    <textarea formControlName="nutritional_info" class="form-control-custom textarea-custom" rows="5"
                        placeholder="Enter nutritional information (calories, protein, carbs, etc.)..."></textarea>
                </div>

                <!-- Row 8: Ingredients -->
                <div class="mb-4">
                    <label class="form-label-custom">
                        <i class="fas fa-list-ul me-2"></i>
                        Ingredients
                    </label>
                    <textarea formControlName="ingredients" class="form-control-custom textarea-custom" rows="5"
                        placeholder="List all ingredients included in this combo pack..."></textarea>
                </div>

                <!-- Row 9: Image Upload -->
                <div class="mb-4">
                    <label class="form-label-custom">Upload Image</label>
                    <div class="file-upload-wrapper" [class.has-preview]="comboForm.get('product_img')?.value">
                        <input type="file" (change)="onFileChange($event)" accept="image/*" />
                        <div class="file-label" *ngIf="!comboForm.get('product_img')?.value">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Click to upload image</span>
                            <small>JPG, PNG (Max 5MB)</small>
                        </div>
                    </div>

                    <div *ngIf="comboForm.get('product_img')?.value" class="image-preview-box mt-3">
                        <img [src]="comboForm.get('product_img')?.value" alt="Preview" />
                        <button type="button" class="btn-remove-img" (click)="removeImage()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Buttons -->
                <div class="form-actions mt-5 d-flex gap-3 justify-content-center">
                    <button type="button" class="btn-cancel" (click)="onCancel()">
                        <i class="fas fa-times me-2"></i>
                        Cancel
                    </button>
                    <button type="submit" class="btn-submit" [disabled]="comboForm.invalid">
                        Create Combo Pack
                        <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
