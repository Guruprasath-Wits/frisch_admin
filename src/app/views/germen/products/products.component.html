<div class="container mt-4">
    <div class="filter-card p-4 mb-4">
      <div class="row d-flex">
        <h3 class="col-md-10 mb-3" style="width: 650px; font-weight: bold !important;">Product List</h3>
        <button type="button" class="btn btn-warning mb-3" style="width: 150px;float: right;" (click)="addProduct()">Add Product</button>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <input
            type="text"
            class="form-control filter-input"
            placeholder="Search by Product Name"
            [(ngModel)]="searchTerm"
          />
        </div>
      </div>
    </div>
  
    <!-- Table with Pagination -->
    <div class="table-card p-3">
      <table class="table table-hover productlist-table cursor-pointer">
        <thead class="table-header">
          <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
            <!-- <th>Stock Quantity</th> -->
            <th>Image</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of filteredProducts | paginate: { itemsPerPage: itemsPerPage, currentPage: page } let i = index">
            <!-- <td>{{ product.id }}</td> -->
            <td>{{ i + 1 + (page - 1) * itemsPerPage }}</td>

            <td>{{ product.name }}</td>
            <td>{{ product.category }}</td>
            <td> € {{ product.price }}</td>
            <!-- <td>{{ product.stockQuantity }}</td> -->
            <td>
              <a [href]="product.imageUrl" >
              <img [src]="product.imageUrl"  class="img-thumbnail" style="width: 200px; height: 150px;" /></a></td>
            
            <td>
              <button class="btn btn-warning btn-sm me-2" (click)="editProduct(product)">
                <i class="fa-solid fa-pen-to-square" style="padding-left: 3px;"></i> 
              </button>
              <button class="btn btn-danger btn-sm" (click)="deleteProduct(product.id)">
                <i class="fa-solid fa-trash" style="padding-left: 3px;"></i> 
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div class="pagination-controls">
      <button (click)="previousPage()" [disabled]="page === 1">Previous</button>
      <span>Page {{ page }} of {{ totalPages }}</span>
      <button (click)="nextPage()" [disabled]="page === totalPages">Next</button>
    </div>
  </div>
