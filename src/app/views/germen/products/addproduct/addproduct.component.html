<div class="container mt-4">
  <h3>Add Product Details</h3>
  <div class="add-user-card">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

      <!-- Product Name & Nick Name -->
      <div class="form-row">
        <div class="form-group">
          <label for="product_name">Product Name</label>
          <input type="text" id="product_name" formControlName="product_name" placeholder="Enter product name" />
          <div *ngIf="productForm.get('product_name')?.invalid && (productForm.get('product_name')?.touched || productForm.get('product_name')?.dirty)" class="error">
            <small *ngIf="productForm.get('product_name')?.errors?.['required']">Product Name is required.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="nick_name">Nick Name</label>
          <input type="text" id="nick_name" formControlName="nick_name" placeholder="Enter Nick name" />
        </div>
      </div>

      <!-- Category & Price -->
      <div class="form-row">
        <!-- Category -->
        <div class="form-group">
          <label for="category">Category</label>
          <div class="dropdown-box">
            <div class="form-control" (click)="toggleCategoryDropdown()" style="cursor: pointer;">
              {{ getSelectedCategoryNames() || 'Select Categories' }}
            </div>

            <div *ngIf="categoryDropdownOpen" class="dropdown-list">
  <div *ngFor="let category of categories" class="checkbox-item">
    <input
      type="checkbox"
      class="form-check-input"
      [checked]="isCategorySelected(category.id)"
      (change)="onCategoryChange(category.id, $event)"
      id="cat_{{ category.id }}"
    />
    <label for="cat_{{ category.id }}" class="form-check-label">{{ category.category_name }}</label>
  </div>
</div>

          </div>
        </div>

        <!-- Price -->
        <div class="form-group">
          <label for="price">Price</label>
          <input type="number" id="price" formControlName="price" placeholder="Enter price (in currency)" />
        </div>
      </div>

      <!-- Weight & Image Upload -->
      <div class="form-row">
        <div class="form-group">
          <label for="weight">Weight/Size/ml</label>
          <input type="number" id="weight" formControlName="weight" />
        </div>

        <div class="form-group">
          <label for="image_file">Upload Image</label>
          <input type="file" id="image_file" (change)="onFileChange($event)" />
          <div *ngIf="productForm.get('product_img')?.value" class="image-preview">
            <img [src]="productForm.get('product_img')?.value" class="preview-img" />
            <button type="button" class="btn btn-danger btn-sm" (click)="removeImage()">Remove</button>
          </div>
        </div>
      </div>

      <!-- Nutritional Info & Ingredients -->
      <div class="form-row">
        <div class="form-group">
          <label for="nutri_inform">Nutritional Information</label>
          <textarea id="nutri_inform" formControlName="nutri_inform" placeholder="Enter nutritional information per serving"></textarea>
        </div>

        <div class="form-group">
          <label for="ingredients">Ingredients</label>
          <textarea id="ingredients" formControlName="ingredients" placeholder="List ingredients"></textarea>
        </div>
      </div>

      <!-- Description & Status -->
      <div class="form-row">
        <div class="form-group">
          <label for="desc">Description</label>
          <textarea id="desc" formControlName="description" placeholder="Enter a brief desc of the product"></textarea>
        </div>

        <div class="form-group">
          <label for="product_status">Product Status</label>
          <select id="product_status" formControlName="product_status">
            <option value="" disabled selected>Select Category</option>
            <option value="Enable">Enable</option>
            <option value="Disable">Disable</option>
          </select>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-warning">Submit</button>

    </form>
  </div>
</div>
