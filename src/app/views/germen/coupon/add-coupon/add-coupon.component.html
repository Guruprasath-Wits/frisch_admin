<div class="container-fluid">
    <div class="form-card mb-4 mt-4">
        <h2 class="form-title">Neuen Gutschein erstellen - Bäckerei</h2>
        <p class="form-subtitle">Bäckerei: Prozent, Versandkostenfrei oder Geld (€1-€100)</p>

        <form [formGroup]="couponForm" (ngSubmit)="onSubmit()">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="code" class="form-label">Gutscheincode *</label>
                    <input type="text" id="code" formControlName="code" class="form-control" placeholder="Z.B., SPAR20">
                    <div *ngIf="couponForm.get('code')?.touched && couponForm.get('code')?.invalid"
                        class="text-danger mt-1">
                        Gutscheincode ist erforderlich.
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="type" class="form-label">Typ *</label>
                    <select id="type" formControlName="type" class="form-select custom-select"
                        (change)="couponForm.get('type')?.updateValueAndValidity()">
                        <option value="">Bitte wählen</option>
                        <option *ngFor="let vt of voucherTypes" [value]="vt.type">{{ vt.type }}</option>
                    </select>
                    <div *ngIf="couponForm.get('type')?.touched && couponForm.get('type')?.invalid"
                        class="text-danger mt-1">
                        Typ ist erforderlich.
                    </div>

                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3" *ngIf="isDiscountFieldVisible">
                    <label for="discount_percentage" class="form-label">Rabattprozentsatz *</label>
                    <input type="text" id="discount_percentage" formControlName="discount_percentage"
                        class="form-control" placeholder="z.B., 20">
                    <div *ngIf="couponForm.get('discount_percentage')?.touched && couponForm.get('discount_percentage')?.invalid"
                        class="text-danger mt-1">
                        Rabattprozentsatz ist erforderlich.
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="description" class="form-label">Beschreibung</label>
                    <input type="text" id="description" formControlName="description" class="form-control"
                        placeholder="z.B., Erhalte 20% Rabatt auf deine Bestellung">
                </div>
            </div>

            <div class="row" *ngIf="isEmailFieldVisible">
                <div class="col-md-12 mb-3">

                    <label for="user_email" class="form-label">Benutzer E-Mail *</label>
                    <c-dropdown [autoClose]="'outside'" class="w-100">
                        <button cButton cDropdownToggle
                            class="form-select text-start d-flex justify-content-between align-items-center w-100 bg-white"
                            type="button">
                            <span>{{ getSelectedUsersDisplay() }}</span>
                        </button>
                        <ul cDropdownMenu class="w-100 px-3 py-2 shadow-sm"
                            style="max-height: 250px; overflow-y: auto; min-width: 100%;">
                            <li *ngFor="let user of userList; let i = index">
                                <c-form-check class="mb-1">
                                    <input cFormCheckInput type="checkbox" [id]="'userCheck' + i"
                                        [checked]="isUserSelected(user.email)"
                                        (change)="onUserCheckChange(user.email, $event)">
                                    <label cFormCheckLabel [for]="'userCheck' + i" class="ms-2">
                                        {{ user.username }} ({{ user.email }})
                                    </label>
                                </c-form-check>
                            </li>
                        </ul>
                    </c-dropdown>
                    <div *ngIf="couponForm.get('user_email')?.touched && couponForm.get('user_email')?.invalid"
                        class="text-danger mt-1">
                        Mindestens eine E-Mail ist erforderlich.
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="from_date" class="form-label">Von Datum *</label>
                    <input type="date" id="from_date" formControlName="from_date" class="form-control">
                    <div *ngIf="couponForm.get('from_date')?.touched && couponForm.get('from_date')?.invalid"
                        class="text-danger mt-1">
                        Von Datum ist erforderlich.
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="end_date" class="form-label">Bis Datum *</label>
                    <input type="date" id="end_date" formControlName="end_date" class="form-control">
                    <div *ngIf="couponForm.get('end_date')?.touched && couponForm.get('end_date')?.invalid"
                        class="text-danger mt-1">
                        Bis Datum ist erforderlich.
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-2">
                <button type="submit" class="btn submit-btn" [disabled]="couponForm.invalid">
                    {{ isEditMode ? 'Gutschein aktualisieren' : 'Gutschein erstellen' }}
                </button>
                <button type="button" class="btn cancel-btn" (click)="onCancel()">Abbrechen</button>
            </div>
        </form>
    </div>
</div>
