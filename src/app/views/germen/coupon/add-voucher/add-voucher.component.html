<div class="container-fluid py-5">
    <div class="premium-form-container fade-in">
        <div class="premium-card">
            <!-- Gradient Header Section -->
            <div class="card-header-gradient">
                <h2 class="form-title">{{ isEditMode ? 'Gutscheintyp bearbeiten' : 'Neuen Gutscheintyp erstellen' }}
                </h2>
                <div class="header-badge">
                    <span>GUTSCHEINVERWALTUNG - BÄCKEREI</span>
                </div>
            </div>

            <!-- Form Body -->
            <div class="card-body-premium">
                <form [formGroup]="voucherForm" (ngSubmit)="onSubmit()" class="modern-form">
                    <div class="row">
                        <!-- Voucher Type Name -->
                        <div class="col-md-6 mb-4">
                            <label for="type" class="form-label-premium">VOUCHER TYPE NAME *</label>
                            <div class="input-container-premium">
                                <i class="fas fa-tag input-icon"></i>
                                <input type="text" id="type" formControlName="type" class="input-premium"
                                    placeholder="Z.B., Rabattprozentsatz">
                            </div>
                            <div *ngIf="voucherForm.get('type')?.touched && voucherForm.get('type')?.invalid"
                                class="error-message">
                                Voucher type name is required.
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="col-md-6 mb-4">
                            <label for="description" class="form-label-premium">BESCHREIBUNG *</label>
                            <div class="input-container-premium">
                                <i class="fas fa-align-left input-icon"></i>
                                <input type="text" id="description" formControlName="description" class="input-premium"
                                    placeholder="Z.B., Erhalte 20% Rabatt...">
                            </div>
                            <div *ngIf="voucherForm.get('description')?.touched && voucherForm.get('description')?.invalid"
                                class="error-message">
                                Description is required.
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Actions -->
                    <div class="form-actions-premium mt-4">
                        <button type="submit" class="btn-premium save-btn" [disabled]="voucherForm.invalid">
                            <i class="fas fa-check me-2"></i>
                            {{ isEditMode ? 'GUTSCHEINTYP AKTUALISIEREN' : 'GUTSCHEINTYP ERSTELLEN' }}
                        </button>
                        <button type="button" class="btn-premium cancel-btn" (click)="onCancel()">
                            ABBRECHEN
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
