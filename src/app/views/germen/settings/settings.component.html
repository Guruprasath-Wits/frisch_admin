
<app-widgets-dropdown />

<style>
    .form-label {
        font-weight: bold !important;
    }

    .form-group .form-control {
        width: 100% !important;
    }
</style>



<div class="container mt-2">
    <!-- <h3 class="mb-4 text-center">Settings</h3> -->
    <div class="card p-4 shadow">
        <form [formGroup]="settingForm" (ngSubmit)="onSubmit()">
            
            <!-- Row 1: Company Name & Email -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="company_name" class="form-label">Company Name</label>
                        <input type="text" id="company_name" formControlName="company_name" class="form-control" placeholder="Enter setting name" />
                        <div *ngIf="settingForm.get('company_name')?.invalid && (settingForm.get('company_name')?.touched || settingForm.get('company_name')?.dirty)" class="text-danger small">
                            <small *ngIf="settingForm.get('company_name')?.errors?.['required']">Company Name is required.</small>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="breaking_news" class="form-label">Breaking News</label>
                        <input type="text" id="breaking_news" formControlName="breaking_news" class="form-control" placeholder="Enter New Value" />
                        <div *ngIf="settingForm.get('breaking_news')?.invalid && (settingForm.get('breaking_news')?.touched || settingForm.get('breaking_news')?.dirty)" class="text-danger small">
                            <small *ngIf="settingForm.get('breaking_news')?.errors?.['required']">This field is required.</small>
                        </div>
                    </div>
                </div>
                <!-- <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter email" />
                        <div *ngIf="settingForm.get('email')?.invalid && (settingForm.get('email')?.touched || settingForm.get('email')?.dirty)" class="text-danger small">
                            <small *ngIf="settingForm.get('email')?.errors?.['required']">Email is required.</small>
                        </div>
                    </div>
                </div> -->
            </div>

            <!-- Row 2: Contact No & Address -->
            <div class="row">
                <div class="col-md-6">
                    <!-- <div class="form-group mb-3">
                        <label for="contact_no" class="form-label">Contact No</label>
                        <input type="number" id="contact_no" formControlName="contact_no" class="form-control" placeholder="Enter contact number" />
                        <div *ngIf="settingForm.get('contact_no')?.invalid && (settingForm.get('contact_no')?.touched || settingForm.get('contact_no')?.dirty)" class="text-danger small">
                            <small *ngIf="settingForm.get('contact_no')?.errors?.['required']">Contact No is required.</small>
                        </div>
                    </div> -->
                </div>
                <!-- <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea id="address" formControlName="address" class="form-control" placeholder="Enter address"></textarea>
                    </div>
                </div> -->
            </div>

            <!-- Row 3: Description & Logo Upload -->
            <div class="row">
                <!-- Logo Upload -->
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="logo_img" class="form-label">Upload Logo Image</label>
                        <input type="file" id="logo_img" (change)="onFileChange($event, 'logo_img')" class="form-control" />
                        <div *ngIf="logoPreview">
                            <img [src]="logoPreview" alt="Logo Preview" class="img-fluid mt-2" style="max-height: 100px;" />
                            <button type="button" class="btn btn-danger btn-sm mt-2" style="margin-left: 50%;" (click)="removeImage('logo_img')">Remove</button>
                        </div>
                        <small class="text-danger">**The file types must be jpg/png/jpeg</small>
                    </div>
                </div>
            
                <!-- Banner Upload -->
               <div class="form-group mb-3">
  <label for="banner_img" class="form-label">Upload Banner Images</label>
  <input
    type="file"
    id="banner_img"
    (change)="onFileChange($event, 'banner_img')"
    class="form-control"
    multiple
  />

  <div class="d-flex flex-wrap mt-2">
    <div
      *ngFor="let banner of bannerPreviews; let i = index"
      class="position-relative me-2 mb-2"
    >
      <img
        [src]="banner"
        alt="Banner Preview"
        class="img-fluid rounded"
        style="max-height: 100px; max-width: 150px; border: 1px solid #ccc;"
      />
      <button
        type="button"
        class="btn btn-danger btn-sm position-absolute"
        style="top: 2px; right: 2px;"
        (click)="removeBanner(i)"
      >
        ×
      </button>
    </div>
  </div>

  <small class="text-danger">**Allowed file types: jpg/png/jpeg</small>
</div>

            </div>
            
            <!-- <div class="row">
              
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="logo_img" class="form-label">Upload Logo Image</label>
                        <input type="file" id="logo_img" (change)="onFileChange($event, 'logo_img')" class="form-control" />
                        <small class="text-danger">**The file types must be jpg/png/jpeg</small>
                    </div>
                </div>
                <div class="col-md-6">
                <div class="form-group mb-3">
                    <label for="banner_img" class="form-label">Upload Banner Image</label>
                    <input type="file" id="banner_img" (change)="onFileChange($event, 'banner_img')" class="form-control" />
                <small class="text-danger">**The file types are must be in jpg/png/jpeg</small>
            </div>
                </div>
            </div> -->

            <!-- Row 4: Delivery Fees -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="weekend_fee" class="form-label">Delivery Fee (Weekend fee)</label>
                        <input type="number" id="weekend_fee" formControlName="weekend_fee" class="form-control" placeholder="Enter Delivery Fee" />
                        <div *ngIf="settingForm.get('weekend_fee')?.invalid && (settingForm.get('weekend_fee')?.touched || settingForm.get('weekend_fee')?.dirty)" class="text-danger small">
                            <small *ngIf="settingForm.get('weekend_fee')?.errors?.['required']">Delivery Fee is required.</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="weekday_fee" class="form-label">Delivery Fee (Weekday fee)</label>
                        <input type="number" id="weekday_fee" formControlName="weekday_fee" class="form-control" placeholder="Enter Delivery Fee" />
                        <div *ngIf="settingForm.get('weekday_fee')?.invalid && (settingForm.get('weekday_fee')?.touched || settingForm.get('weekday_fee')?.dirty)" class="text-danger small">
                            <small *ngIf="settingForm.get('weekday_fee')?.errors?.['required']">Delivery Fee is required.</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 5: Stripe & Publishable Keys -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="agb" class="form-label">AGB</label>
                        <input type="text" id="publish_key" formControlName="agb" class="form-control" placeholder="Enter AGB" />
                        
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="data_protection" class="form-label">Data Protection</label>
                        <input type="text" id="publish_key" formControlName="data_protection" class="form-control" placeholder="Enter Data Protection" />
                    </div>
                </div>
            </div>

            <!-- Row 6: New Key (Left Side Only) -->
            <div class="row">
                <div class="col-md-6">
                    <label for="cancellation_policy" class="form-label">Cancellation Policy</label>
                    <input type="text" id="publish_key" formControlName="cancellation_policy" class="form-control" placeholder="Enter Cancellation Policy" />
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="description" class="form-label">SEPA(Declaration)</label>
                        <textarea id="description" formControlName="description" class="form-control" placeholder="Enter a Declaration"></textarea>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="webshop" class="form-label">Webshop</label>
                        <input type="text" id="webshop" formControlName="webshop" class="form-control" placeholder="Enter Webshop" />
                        
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="telephone" class="form-label">Telephone</label>
                        <input type="text" id="telephone" formControlName="telephone" class="form-control" placeholder="Enter Telephone" />
                    </div>
                </div>
            </div>

            <!-- <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label for="breaking_news" class="form-label">Breaking News</label>
                        <input type="text" id="breaking_news" formControlName="breaking_news" class="form-control" placeholder="Enter New Value" />
                        <div *ngIf="settingForm.get('breaking_news')?.invalid && (settingForm.get('breaking_news')?.touched || settingForm.get('breaking_news')?.dirty)" class="text-danger small">
                            <small *ngIf="settingForm.get('breaking_news')?.errors?.['required']">This field is required.</small>
                        </div>
                    </div>
                </div>
            </div> -->

            <!-- Submit Button -->
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-warning" style="width: 150px;">
                    {{ isEditMode ? 'Update' : 'Submit' }}
                </button>
            </div>
        </form>
    </div>
</div>
