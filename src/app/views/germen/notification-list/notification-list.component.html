<div class="notification-container fade-in">
  <div class="header-section">
    <h2 class="page-title">Notifications</h2>

    <div class="filter-tabs">
      <button class="tab-btn" [class.active]="filterStatus === 'all'" (click)="onFilterChange('all')">
        All
      </button>
      <button class="tab-btn" [class.active]="filterStatus === 'unread'" (click)="onFilterChange('unread')">
        Unread
        <span *ngIf="filterStatus !== 'unread'" class="badge-dot"></span>
      </button>
      <button class="tab-btn" [class.active]="filterStatus === 'read'" (click)="onFilterChange('read')">
        Read
      </button>
    </div>
  </div>

  <div class="notification-list">
    <div *ngIf="filteredNotifications.length === 0" class="empty-state">
      <i class="fas fa-bell-slash"></i>
      <p>No notifications found.</p>
    </div>

    <div *ngFor="let notification of filteredNotifications" class="notification-card"
      [class.unread]="notification.status === 'unread'" (click)="viewNotification(notification.id)">

      <div class="card-left">
        <div class="icon-circle" [style.background-color]="getIconColor(notification.title) + '20'"
          [style.color]="getIconColor(notification.title)">
          <i [class]="getIcon(notification.title)"></i>
        </div>
      </div>

      <div class="card-content">
        <div class="content-header">
          <h5 class="notification-title">{{ notification.title }}</h5>
          <span class="notification-date">{{ notification.created_at | date:'MMM d, y, h:mm a' }}</span>
        </div>
        <p class="notification-desc">{{ notification.desc }}</p>
      </div>

      <div class="card-right">
        <span *ngIf="notification.status === 'unread'" class="status-indicator" title="Unread"></span>
        <button class="btn-icon">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>

    </div>
  </div>
</div>
