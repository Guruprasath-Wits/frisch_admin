<div class="container-fluid delivery-container fade-in">
  <div class="row g-4">
    <!-- Left Column: Add New Area Form -->
    <div class="col-lg-4">
      <div class="premium-card">
        <div class="card-header-premium">
          <h2 class="card-title">{{ isEditMode ? 'Edit Area' : 'Add New Area' }}</h2>
          <div class="header-badge">Manage your delivery zones</div>
        </div>

        <div class="card-body p-0">
          <form [formGroup]="areaForm" (ngSubmit)="onSubmit()" class="area-form-premium">

            <div class="form-group mb-4">
              <label class="form-label-premium">Area Name</label>
              <div class="input-group-premium">
                <i class="fas fa-map-marker-alt input-icon"></i>
                <input type="text" formControlName="area_name" class="form-control-premium"
                  placeholder="e.g. Dortmund" />
              </div>
            </div>

            <div class="form-group mb-4">
              <label class="form-label-premium">Zip Code</label>
              <div class="input-group-premium">
                <i class="fas fa-mail-bulk input-icon"></i>
                <textarea formControlName="zipcode" class="form-control-premium"
                  placeholder="Enter zipcode(s)..."></textarea>
              </div>
            </div>

            <div class="form-actions mt-5">
              <button type="submit" class="btn-save-premium" [class.active]="areaForm.valid"
                [disabled]="areaForm.invalid">
                <i class="fas" [ngClass]="isEditMode ? 'fa-sync-alt' : 'fa-plus-circle'"></i>
                {{ isEditMode ? 'Update Area' : 'Save Area' }}
                <i class="fas fa-arrow-right ms-auto"></i>
              </button>
              <button type="button" class="btn-discard-premium" *ngIf="isEditMode" (click)="resetForm()">
                Discard Changes
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>

    <!-- Right Column: Areas List -->
    <div class="col-lg-8">
      <div class="premium-card">
        <div class="card-header-premium">
          <h2 class="card-title">Areas List</h2>
          <div class="header-badge">Total Areas: {{ areas.length }}</div>
        </div>

        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table custom-table mb-0">
              <thead>
                <tr>
                  <th class="text-center" width="60">#</th>
                  <th width="35%">Area Name</th>
                  <th>ZipCode</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let area of paginatedAreas; let i = index">
                  <td class="text-center">
                    <span class="fw-bold text-muted">{{ (page - 1) * itemsPerPage + i + 1 }}</span>
                  </td>
                  <td>
                    <span class="area-name-text">{{ area.area_name }}</span>
                  </td>
                  <td>
                    <span class="zip-badge">{{ area.zipcode }}</span>
                  </td>
                  <td class="text-end">
                    <div class="d-flex justify-content-end">
                      <button class="btn-action-premium edit" (click)="onEdit(area)" title="Edit">
                        <i class="fas fa-pencil-alt"></i>
                      </button>
                      <button class="btn-action-premium delete" (click)="onDelete(area.id)" title="Delete">
                        <i class="fas fa-trash-alt"></i>
                      </button>
                    </div>
                  </td>
                </tr>

                <!-- Empty State -->
                <tr *ngIf="areas.length === 0">
                  <td colspan="4" class="text-center py-5">
                    <div class="text-center opacity-25">
                      <i class="fas fa-map-marked-alt mb-3" style="font-size: 4rem;"></i>
                      <h4 class="fw-bold">No Delivery Areas Found</h4>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pagination -->
        <div class="card-footer p-0 border-0" *ngIf="totalPages > 1">
          <div class="pagination-premium">
            <button class="page-btn" (click)="previousPage()" [disabled]="page === 1">
              <i class="fas fa-chevron-left"></i>
            </button>
            <span class="page-info">Page {{ page }} of {{ totalPages }}</span>
            <button class="page-btn" (click)="nextPage()" [disabled]="page === totalPages">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
