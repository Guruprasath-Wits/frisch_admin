<div class="container">
    <h3 class="mb-2" style="text-align: center; font-weight: bold !important;">{{ isEditMode ? 'Edit Areas' : 'Add Areas' }}</h3>
  
    <div class="add-user-card mb-3">
      <form [formGroup]="areaForm" (ngSubmit)="onSubmit()" class="area-form" enctype="multipart/form-data">
        <div class="form-group mb-3">
          <label class="form-label" for="area_name">Area Name</label>
          <input type="text" id="area_name" formControlName="area_name" class="form-control" placeholder="Enter area name" />
        </div>
  
        <div class="form-group mb-3">
          <label class="form-label" for="description">Zip Code</label>
          <textarea id="description" formControlName="zipcode" class="form-control" placeholder="Enter zipcode"></textarea>
        </div>
  
  
        <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Update Area' : 'Add Area' }}</button>
        <!-- <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button> -->
      </form>
    </div>
  
    <h3 style="text-align: center; font-weight: bold !important;">Areas List</h3>
  
    <div class="add-user-card">
      <table class="table  table-hover area-table">
        <thead>
          <tr>
            <!-- <th>ID</th> -->
            <th>S.No</th>
            <th>Area Name</th>
            <th>ZipCode</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let area of paginatedAreas ; let i = index">
            <td>{{ (page - 1) * itemsPerPage + i + 1 }}</td>
            <!-- <td>{{ area.id }}</td> -->
            <td>{{ area.area_name }}</td>
            <td>{{ area.zipcode }}</td>
            <td>
              <button class="btn btn-warning btn-sm"  (click)="onEdit(area)">
                <i class="fa-solid fa-pen-to-square" ></i></button>
              <button class="btn btn-danger btn-sm" style="margin-left: 5px;" (click)="onDelete(area.id)">
                <i class="fa-solid fa-trash" ></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div class="pagination-controls">
      <button (click)="previousPage()" [disabled]="page === 1">Previous</button>
      <span>Page {{ page }} of {{ totalPages }}</span>
      <button (click)="nextPage()" [disabled]="page === totalPages">Next</button>
    </div>
  </div>
