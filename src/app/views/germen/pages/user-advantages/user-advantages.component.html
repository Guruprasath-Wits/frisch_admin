<div class="container">
    <h3 class="mb-2" style="text-align: center; font-weight: bold !important;">{{ isEditMode ? 'Edit Advantagess' : 'Add Advantagess' }}</h3>
  
    <div class="add-user-card mb-3">
      <form [formGroup]="advantagesForm" (ngSubmit)="onSubmit()" class="advantages-form" enctype="multipart/form-data">
        <div class="form-group mb-3">
          <label class="form-label" for="advantages_name">Advantages Question</label>
          <input type="text" id="advantages_name" formControlName="adv_qns" class="form-control" placeholder="Enter advantages Question" />
        </div>
  
        <div class="form-group mb-3">
          <label class="form-label" for="description">Advantages Answer</label>
          <textarea id="description" formControlName="adv_ans" class="form-control" placeholder="Enter advantages Answer"></textarea>
        </div>
  
  
        <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Update Advantages' : 'Add Advantages' }}</button>
        <!-- <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button> -->
      </form>
    </div>
  
    <h3 style="text-align: center; font-weight: bold !important;">Advantagess List</h3>
  
    <div class="add-user-card">
      <table class="table  table-hover advantages-table">
        <thead>
          <tr>
            <!-- <th>ID</th> -->
            <th>S.No</th>
            <th>Advantages Question</th>
            <th>Advantages Answer</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let advantages of paginatedUserAdv ; let i = index">
            <td>{{ (page - 1) * itemsPerPage + i + 1 }}</td>
            <!-- <td>{{ advantages.id }}</td> -->
            <td>{{ advantages.adv_qns }}</td>
            <td>{{ advantages.adv_ans }}</td>
            <td>
              <button class="btn btn-warning btn-sm"  (click)="onEdit(advantages)">
                <i class="fa-solid fa-pen-to-square" ></i></button>
              <button class="btn btn-danger btn-sm" style="margin-left: 5px;" (click)="onDelete(advantages.id)">
                <i class="fa-solid fa-trash" ></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div class="pagination-controls">
      <button (click)="previousPage()" [disabled]="page === 1">Previous</button>
      <span>Page {{ page }} of {{ totalPages }}</span>
      <button (click)="nextPage()" [disabled]="page === totalPages">Next</button>
    </div>
  </div>
