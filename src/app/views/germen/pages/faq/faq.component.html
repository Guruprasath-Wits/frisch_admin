<div class="container-fluid faq-container fade-in">
  <!-- FAQ Header Controls -->
  <div class="row justify-content-center">
    <div class="col-12">
      <!-- Add/Edit FAQ Card -->
      <div class="premium-card">
        <div class="card-header-premium">
          <h2 class="card-title">{{ isEditMode ? 'Modify FAQ Entry' : 'Create New FAQ' }}</h2>
          <span class="card-subtitle">Allgemeine Fragen und Antworten für Kunden verwalten</span>
        </div>

        <div class="card-body p-0">
          <form [formGroup]="faqForm" (ngSubmit)="onSubmit()" class="faq-form-premium">
            <div class="row g-4">
              <div class="col-md-12">
                <div class="form-group-premium">
                  <label class="form-label-premium" for="faq_qns">FAQ Question</label>
                  <div class="input-group-premium">
                    <i class="fas fa-question-circle input-icon"></i>
                    <input type="text" id="faq_qns" formControlName="faq_qns" class="form-control-premium"
                      placeholder="e.g. How do I order products?" />
                  </div>
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group-premium">
                  <label class="form-label-premium" for="faq_ans">FAQ Answer</label>
                  <div class="input-group-premium">
                    <i class="fas fa-comment-dots input-icon"></i>
                    <textarea id="faq_ans" formControlName="faq_ans" class="form-control-premium"
                      placeholder="Provide a detailed and helpful answer..."></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-actions text-center mt-4">
              <button type="submit" class="btn-submit-premium" [disabled]="faqForm.invalid">
                <i class="fas mr-2" [ngClass]="isEditMode ? 'fa-sync-alt' : 'fa-plus-circle'"></i>
                {{ isEditMode ? 'Update FAQ' : 'Add FAQ Entry' }}
              </button>
              <button type="button" *ngIf="isEditMode" class="btn-cancel-premium" (click)="resetForm()">
                <i class="fas fa-times mr-2"></i> Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- FAQs List Header -->
      <div class="text-center mt-5 mb-4">
        <h3 class="fw-bold text-dark">Existing FAQs List</h3>
        <p class="text-muted">Currently active questions in the system</p>
      </div>

      <!-- FAQs List Grid -->
      <div class="faq-list-premium" *ngIf="faqs.length > 0; else noFaqs">
        <div class="faq-item-card" *ngFor="let faq of paginatedFaqs; let i = index">
          <div class="faq-content">
            <span class="faq-q text-truncate-2">
              <i class="fas fa-chevron-right text-warning me-2 small"></i>
              {{ faq.faq_qns }}
            </span>
            <span class="faq-a">
              {{ faq.faq_ans }}
            </span>
          </div>
          <div class="faq-actions">
            <button class="btn-action-premium edit" (click)="onEdit(faq)" title="Edit FAQ">
              <i class="fas fa-pencil-alt"></i>
            </button>
            <button class="btn-action-premium delete" (click)="onDelete(faq.id)" title="Delete FAQ">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <ng-template #noFaqs>
        <div class="text-center py-5">
          <i class="fas fa-comments-slash opacity-10 mb-3" style="font-size: 4rem;"></i>
          <p class="text-muted fs-5">No FAQs available yet. Start by adding one above.</p>
        </div>
      </ng-template>

      <!-- Pagination Premium -->
      <div class="pagination-premium" *ngIf="totalPages > 1">
        <button class="page-btn" (click)="previousPage()" [disabled]="page === 1">
          <i class="fas fa-chevron-left"></i>
        </button>
        <span class="page-info">Page {{ page }} of {{ totalPages }}</span>
        <button class="page-btn" (click)="nextPage()" [disabled]="page === totalPages">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>
