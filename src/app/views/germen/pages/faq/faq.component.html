<div class="container">
  <h3 class="mb-2" style="text-align: center; font-weight: bold !important;">{{ isEditMode ? 'Edit FAQ' : 'Add FAQ' }}</h3>

  <!-- FAQ Form Section -->
  <div class="card mb-4 p-3">
    <form [formGroup]="faqForm" (ngSubmit)="onSubmit()" class="faq-form">
      <div class="form-group mb-3">
        <label class="form-label" for="faq_qns">FAQ Question</label>
        <input type="text" id="faq_qns" formControlName="faq_qns" class="form-control" placeholder="Enter FAQ question" />
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="faq_ans">FAQ Answer</label>
        <textarea id="faq_ans" formControlName="faq_ans" class="form-control" placeholder="Enter FAQ answer"></textarea>
      </div>

      <button type="submit" class="btn btn-primary me-2">
        {{ isEditMode ? 'Update FAQ' : 'Add FAQ' }}
      </button>
      <button type="button" *ngIf="isEditMode" class="btn btn-secondary" (click)="resetForm()">Cancel</button>
    </form>
  </div>

 <!-- FAQs List Section -->
<h3 class="mt-4" style="text-align: center; font-weight: bold !important;">FAQs List</h3>
<div *ngIf="faqs.length > 0; else noFaqs" class="card">
  <table class="table table-striped table-hover mt-3 mb-0">
    <thead>
      <tr>
        <th>S.No</th>
        <th>Question</th>
        <th>Answer</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let faq of paginatedFaqs ; let i = index">
        <td>{{ (page - 1) * itemsPerPage + i + 1 }}</td>
        <!-- <td>{{ faq.id }}</td> -->
        <td>{{ faq.faq_qns }}</td>
        <td>{{ faq.faq_ans }}</td>
        <td>
          <button class="btn btn-warning btn-sm" (click)="onEdit(faq)">
            <i class="fas fa-pen"></i>
          </button>
          <button class="btn btn-danger btn-sm ms-2" (click)="onDelete(faq.id)">
            <i class="fas fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>


  <!-- Empty State -->
  <ng-template #noFaqs>
    <p class="text-center mt-3">No FAQs available. Please add a new FAQ.</p>
  </ng-template>

  <!-- Pagination Controls -->
  <div class="pagination-controls d-flex justify-content-center align-items-center mt-3">
    <button class="btn btn-outline-secondary me-2" (click)="previousPage()" [disabled]="page === 1">Previous</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button class="btn btn-outline-secondary ms-2" (click)="nextPage()" [disabled]="page === totalPages">Next</button>
  </div>
</div>
