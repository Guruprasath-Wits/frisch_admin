<div class="container-fluid imprint-container fade-in">
    <div class="row justify-content-center">
        <div class="col-xl-9 col-lg-10">
            <div class="premium-card">
                <!-- Loading Spinner overlay -->
                <div class="loading-overlay" *ngIf="isLoading">
                    <div class="spinner-border text-warning" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- Premium Header -->
                <div class="card-header-custom">
                    <h2 class="card-title">Impressum & Legal</h2>
                    <p class="card-subtitle">Rechtliche Informationen und Firmendaten verwalten</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form [formGroup]="imprintForm" (ngSubmit)="onSubmit()">

                        <!-- Section 1: Company Information -->
                        <div class="form-section mb-5">
                            <div class="section-header">
                                <i class="fas fa-building"></i>
                                <h5>Company Information</h5>
                            </div>
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">Owner / Name</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-user-tie input-icon"></i>
                                            <input type="text" formControlName="name" class="form-control-custom"
                                                placeholder="Enter full name" />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">Company Name</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-industry input-icon"></i>
                                            <input type="text" formControlName="company_name"
                                                class="form-control-custom" placeholder="Enter company name" />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">Full Address</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-map-marker-alt input-icon"></i>
                                            <input type="text" formControlName="address" class="form-control-custom"
                                                placeholder="Street, City, Zip, Country" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section 2: Contact & Business Type -->
                        <div class="form-section mb-5">
                            <div class="section-header">
                                <i class="fas fa-address-book"></i>
                                <h5>Contact & Business Details</h5>
                            </div>
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">E-Mail Address</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-envelope input-icon"></i>
                                            <input type="email" formControlName="email" class="form-control-custom"
                                                placeholder="e.g. info@company.de" />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">Mobile / Phone No</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-phone-alt input-icon"></i>
                                            <input type="text" formControlName="tel" class="form-control-custom"
                                                placeholder="+49 000 0000000" />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">Business Type / Tax Info</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-briefcase input-icon"></i>
                                            <input type="text" formControlName="business_type"
                                                class="form-control-custom"
                                                placeholder="e.g. Kleinunternehmerregelung" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section 3: Online Presence -->
                        <div class="form-section mb-5">
                            <div class="section-header">
                                <i class="fas fa-globe"></i>
                                <h5>Online Presence</h5>
                            </div>
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">Platform Name</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-server input-icon"></i>
                                            <input type="text" formControlName="platform" class="form-control-custom"
                                                placeholder="e.g. Web, App" />
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">External Link / URL</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-link input-icon"></i>
                                            <input type="text" formControlName="link" class="form-control-custom"
                                                placeholder="https://..." />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section 4: Additional Content -->
                        <div class="form-section mb-5">
                            <div class="section-header">
                                <i class="fas fa-file-contract"></i>
                                <h5>Legal Notes & Privacy</h5>
                            </div>
                            <div class="row g-4">
                                <div class="col-md-12">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">General Notes</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-sticky-note input-icon" style="top: 25px;"></i>
                                            <textarea formControlName="notes" class="form-control-custom"
                                                placeholder="Additional legal notes..."></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-group-custom">
                                        <label class="form-label-custom">Delivery App Privacy Policy</label>
                                        <div class="input-group-custom">
                                            <i class="fas fa-user-shield input-icon" style="top: 25px;"></i>
                                            <textarea formControlName="privacy_policy" class="form-control-custom"
                                                placeholder="Detailed privacy policy content..."></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions text-center mt-5">
                            <button type="submit" class="btn-submit-premium"
                                [disabled]="imprintForm.invalid || isLoading">
                                <i class="fas" [ngClass]="isEditMode ? 'fa-sync-alt' : 'fa-check-circle'"></i>
                                {{ isEditMode ? 'Update Imprint' : 'Save Imprint' }}
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
