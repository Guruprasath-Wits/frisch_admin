<div class="container mt-4">
    <!-- Header Section -->
    <div class="filter-card p-4 mb-4">
      <div class="row d-flex align-items-center">
        <h3 class="col-md-10 mb-3" style="font-weight: bold !important;">Customer Enquiry</h3>
      </div>
    </div>
  
    <!-- Contact Us Table -->
    <div class="table-card p-3">
      <table class="table table-hover contactUslist-table">
        <thead class="table-header bg-light">
          <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let contactUs of filteredcontactUs | paginate: { itemsPerPage: itemsPerPage, currentPage: page }; let i = index">
            <td>{{ (page - 1) * itemsPerPage + i + 1 }}</td>
            <td>{{ contactUs.firstname }}</td>
            <td>{{ contactUs.lastname }}</td>
            <td>{{ contactUs.email }}</td>
            <td>{{ contactUs.phone }}</td>
            <td>{{ contactUs.description }}</td>
            <td>
                <button class="btn btn-danger btn-sm" (click)="deleteContact(contactUs.id)">
                    <i class="fa-solid fa-trash" style="padding-left: 3px;"></i> 
                  </button>
            </td>
          </tr>
        </tbody>
      </table>
  
      <!-- No Data Message -->
      <div *ngIf="filteredcontactUs.length === 0" class="text-center py-3">
        <p class="text-muted">No contact data available.</p>
      </div>
    </div>
  
    <div class="pagination-controls">
        <button (click)="previousPage()" [disabled]="page === 1">Previous</button>
        <span>Page {{ page }} of {{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="page === totalPages">Next</button>
      </div>
  </div>
