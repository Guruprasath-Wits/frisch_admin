<div class="container-fluid jobs-container fade-in">
  <div class="row justify-content-center">
    <div class="col-12">
      <!-- Add/Edit Job Card -->
      <div class="premium-card">
        <div class="card-header-premium">
          <h2 class="card-title">{{ isEditMode ? 'Modify Job Listing' : 'Create New Job Opening' }}</h2>
          <span class="card-subtitle">Verwalten Sie Stellenangebote und Karrieremöglichkeiten</span>
        </div>

        <div class="card-body p-0">
          <form [formGroup]="jobForm" (ngSubmit)="onSubmit()" class="job-form-premium">
            <div class="row g-4">
              <div class="col-md-12">
                <div class="form-group-premium">
                  <label class="form-label-premium" for="job_name">Job Title / Designation</label>
                  <div class="input-group-premium">
                    <i class="fas fa-briefcase input-icon"></i>
                    <input type="text" id="job_name" formControlName="title" class="form-control-premium"
                      placeholder="e.g. Delivery Driver, Warehouse Manager" />
                  </div>
                </div>
              </div>

              <div class="col-md-12">
                <div class="form-group-premium">
                  <label class="form-label-premium" for="description">Job Description & Requirements</label>
                  <div class="input-group-premium">
                    <i class="fas fa-list-alt input-icon"></i>
                    <textarea id="description" formControlName="description" class="form-control-premium"
                      placeholder="Provide detailed responsibilities and requirements..."></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-actions text-center mt-4">
              <button type="submit" class="btn-submit-premium" [disabled]="jobForm.invalid">
                <i class="fas mr-2" [ngClass]="isEditMode ? 'fa-sync-alt' : 'fa-plus-circle'"></i>
                {{ isEditMode ? 'Update Job' : 'Add Job Listing' }}
              </button>
              <button type="button" *ngIf="isEditMode" class="btn-cancel-premium" (click)="resetForm()">
                <i class="fas fa-times mr-2"></i> Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Jobs List Header -->
      <div class="text-center mt-5 mb-4">
        <h3 class="fw-bold text-dark">Active Job Openings</h3>
        <p class="text-muted">Currently published careers on your platform</p>
      </div>

      <!-- Jobs List Grid (Full Width) -->
      <div class="job-list-premium" *ngIf="jobs.length > 0; else noJobs">
        <div class="job-item-card" *ngFor="let job of paginatedJobs; let i = index">
          <div class="job-content">
            <span class="job-title-text">
              <i class="fas fa-paperclip text-warning me-2 small"></i>
              {{ job.title }}
            </span>
            <span class="job-desc-text" [innerHTML]="formatDescription(job.description)"></span>
          </div>
          <div class="job-actions">
            <button class="btn-action-premium edit" (click)="onEdit(job)" title="Edit Job">
              <i class="fas fa-pencil-alt"></i>
            </button>
            <button class="btn-action-premium delete" (click)="onDelete(job.id)" title="Delete Job">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <ng-template #noJobs>
        <div class="text-center py-5">
          <i class="fas fa-user-slash opacity-10 mb-3" style="font-size: 4rem;"></i>
          <p class="text-muted fs-5">No job listings found. Start by creating one above.</p>
        </div>
      </ng-template>

      <!-- Pagination Premium -->
      <div class="pagination-premium" *ngIf="totalPages > 1">
        <button class="page-btn" (click)="previousPage()" [disabled]="page === 1">
          <i class="fas fa-chevron-left"></i>
        </button>
        <span class="page-info">Page {{ page }} of {{ totalPages }}</span>
        <button class="page-btn" (click)="nextPage()" [disabled]="page === totalPages">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>
